{% extends "auth_base.html" %}
{% block title %}Log in{% endblock %}
{% block form %}
<h2 class="h1 mb-1">Log in</h2>
<p class="text-muted mb-4">Use your college lab account.</p>
<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label" for="username">Username</label>
    <input class="form-control form-control-lg" id="username" name="username" value="{{ username or '' }}" required autofocus autocomplete="username">
  </div>
  <div class="mb-4">
    <label class="form-label" for="password">Password</label>
    <input class="form-control form-control-lg" id="password" name="password" type="password" required autocomplete="current-password">
  </div>
  <button class="btn btn-primary btn-lg w-100">Log in</button>
</form>
<p class="mt-4 mb-0 text-muted">New to the lab? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
{% endblock %}
